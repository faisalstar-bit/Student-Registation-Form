<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration Form.</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div>
      <form>
        <label for="fname">Full Name:</label>
        <input
          type="text"
          name="fname"
          id="fname"
          placeholder="Enter your name"
          required
        />

        <br />

        <label for="email">Email: </label>
        <input
          type="email"
          name="email"
          id="email"
          placeholder="Enter your email"
          required
        />

        <br />
        <label for="password">Password:</label>
        <input
          type="password"
          name="password"
          id="password"
          placeholder="Enter your password"
          required
        />
        <br />

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required />
        <br />

        <label>Gender:</label>

        <input type="radio" id="male" name="gender" value="male" required />
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female" required />
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="other" required />
        <label for="other">Other</label>

        <br />

        <label>Skills:</label>

        <input type="checkbox" id="html" name="fav_lang" value="html" re />
        <label for="html">HTML</label>

        <input type="checkbox" id="python" name="fav_lang" value="python" />
        <label for="python">Python</label>

        <input type="checkbox" id="css" name="fav_lang" value="css" />
        <label for="css">CSS</label>

        <input
          type="checkbox"
          id="javascript"
          name="fav_lang"
          value="javascript"
        />
        <label for="javascript">JavaScript</label>

        <br />

        <label for="address">Address:</label>
        <textarea
          id="address"
          name="address"
          rows="4"
          cols="30"
          placeholder="Enter your address"
        ></textarea>
        <br />

        <label for="selectprograme">Select Programe:</label>
        <select id="selectprograme" name="selectprograme">
          <option value="cs">BSCS</option>
          <option value="se">BSSE</option>
          <option value="ai">BSAI</option>
          <option value="it">BSIT</option>
        </select>

        <br />

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
      </form>
    </div>
  </body>
</html>
